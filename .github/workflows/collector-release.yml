name: Collector private release

on:
  push:
    tags:
      - "collector-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install bounded collector build dependencies
        run: python -m pip install ".[collector,dev]" "pyinstaller==6.21.0"
      - name: Test collector
        run: python -m pytest tests/test_collector_app.py tests/test_collector_core.py tests/test_collector_credentials.py tests/test_collector_fca_api.py -q
      - name: Build Windows executable
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --collect-all keyring --hidden-import keyring.backends.Windows
          --name GovScout-Collector-Windows-x86_64
          src/govscout_collector/__main__.py
      - name: Smoke-test Windows executable
        shell: pwsh
        run: '& "dist/GovScout-Collector-Windows-x86_64.exe" --version'
      - name: Create Windows checksum
        shell: pwsh
        run: |
          $file = "dist/GovScout-Collector-Windows-x86_64.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
          "$hash  GovScout-Collector-Windows-x86_64.exe" | Set-Content -NoNewline "dist/GovScout-Collector-Windows-x86_64.exe.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: GovScout-Collector-Windows-x86_64
          path: |
            dist/GovScout-Collector-Windows-x86_64.exe
            dist/GovScout-Collector-Windows-x86_64.exe.sha256
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            expected_arch: x86_64
            artifact: GovScout-Collector-macOS-x86_64
          - runner: macos-15
            expected_arch: arm64
            artifact: GovScout-Collector-macOS-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.expected_arch }}"
      - name: Install bounded collector build dependencies
        run: python -m pip install ".[collector,dev]" "pyinstaller==6.21.0"
      - name: Test collector
        run: python -m pytest tests/test_collector_app.py tests/test_collector_core.py tests/test_collector_credentials.py tests/test_collector_fca_api.py -q
      - name: Build macOS application
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --collect-all keyring --hidden-import keyring.backends.macOS
          --name "${{ matrix.artifact }}"
          src/govscout_collector/__main__.py
      - name: Smoke-test macOS application
        run: '"dist/${{ matrix.artifact }}.app/Contents/MacOS/${{ matrix.artifact }}" --version'
      - name: Package macOS application and checksum
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/${{ matrix.artifact }}.app" "dist/${{ matrix.artifact }}.zip"
          cd dist
          shasum -a 256 "${{ matrix.artifact }}.zip" > "${{ matrix.artifact }}.zip.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.zip
            dist/${{ matrix.artifact }}.zip.sha256
          if-no-files-found: error

  publish-release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/collector-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
      - name: Create private-test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "GovScout Collector $GITHUB_REF_NAME" --prerelease \
              --notes "Unsigned private-test builds for H. Windows may show SmartScreen. On macOS, unzip, then right-click the app and choose Open on first launch. Verify the adjacent SHA-256 checksum before use."
      - name: Upload release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            dist/GovScout-Collector-Windows-x86_64/GovScout-Collector-Windows-x86_64.exe \
            dist/GovScout-Collector-Windows-x86_64/GovScout-Collector-Windows-x86_64.exe.sha256 \
            dist/GovScout-Collector-macOS-x86_64/GovScout-Collector-macOS-x86_64.zip \
            dist/GovScout-Collector-macOS-x86_64/GovScout-Collector-macOS-x86_64.zip.sha256 \
            dist/GovScout-Collector-macOS-arm64/GovScout-Collector-macOS-arm64.zip \
            dist/GovScout-Collector-macOS-arm64/GovScout-Collector-macOS-arm64.zip.sha256 \
            --clobber
